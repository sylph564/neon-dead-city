name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java and Android SDK
        run: |
          apt-get update
          apt-get install -y openjdk-17-jdk wget unzip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/android-tools.zip
          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -r /tmp/android-tools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
            "ndk;23.2.8568313" "cmake;3.10.2.4988404"

      - name: Install Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android signing and SDK paths
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          sed -i "s|/github/home/.android/debug.keystore|$HOME/.android/debug.keystore|g" export_presets.cfg

      - name: Diagnose Android export preset
        run: |
          echo "HOME=$HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -f "$HOME/.android/debug.keystore"
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable"
          echo "---- Android preset ----"
          cat export_presets.cfg
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/NEON-DEAD-CITY.apk

      - name: Verify APK
        run: |
          test -s build/NEON-DEAD-CITY.apk
          ls -lh build/NEON-DEAD-CITY.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-DEAD-CITY-Android
          path: build/NEON-DEAD-CITY.apk
          if-no-files-found: error
