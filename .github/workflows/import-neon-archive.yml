name: Import NEON project archive

on:
  push:
    branches:
      - neon-update-0.2.0
    paths:
      - NEON_DEAD_CITY_0.3.0.zip

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: neon-update-0.2.0
          fetch-depth: 0

      - name: Extract project files
        run: |
          test -f NEON_DEAD_CITY_0.3.0.zip
          mkdir -p /tmp/neon-import
          unzip -q NEON_DEAD_CITY_0.3.0.zip -d /tmp/neon-import
          test -d /tmp/neon-import/neon-dead-city-main
          cp -a /tmp/neon-import/neon-dead-city-main/. .
          rm NEON_DEAD_CITY_0.3.0.zip

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit."
          else
            git commit -m "Import NEON project overhaul 0.3.0"
            git push origin HEAD:neon-update-0.2.0
          fi
